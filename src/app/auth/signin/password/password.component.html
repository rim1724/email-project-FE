<main class="password-page">
  <section class="password-card" aria-labelledby="password-title">
    <div class="account-intro">
      <img class="google-logo" src="/images/330px-Google_Favicon_2025.svg.png" alt="Google" />
      <h1 id="password-title">Chào mừng</h1>
      <button
        class="account-chip"
        type="button"
        aria-label="Chọn tài khoản khác"
        (click)="accountChangeRequested.emit()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 4a3.2 3.2 0 1 1 0 6.4A3.2 3.2 0 0 1 12 6Zm0 12.8a7.7 7.7 0 0 1-5.8-2.6c.1-1.9 3.9-3 5.8-3s5.7 1.1 5.8 3a7.7 7.7 0 0 1-5.8 2.6Z"
          />
        </svg>
        <span>{{ accountEmail() || 'Chọn tài khoản' }}</span>
        <span class="chevron" aria-hidden="true"></span>
      </button>
    </div>

    <div class="password-content">
      <form (submit)="submit($event)" novalidate>
        <div class="input-field">
          <input
            id="account-password"
            name="password"
            [type]="showPassword() ? 'text' : 'password'"
            autocomplete="current-password"
            placeholder=" "
            [formControl]="password"
            [attr.aria-invalid]="password.touched && password.invalid"
            [attr.aria-describedby]="password.touched && password.invalid ? 'password-error' : null"
          />
          <label for="account-password">Nhập mật khẩu của bạn</label>
        </div>

        <label class="show-password">
          <input
            type="checkbox"
            [checked]="showPassword()"
            (change)="togglePassword($event)"
          />
          <span>Hiện mật khẩu</span>
        </label>

        <div class="actions">
          <button
            class="text-action forgot-password"
            type="button"
            (click)="forgotPasswordRequested.emit()"
          >
            Thử cách khác
          </button>
          <button class="next-button" type="submit">Tiếp theo</button>
        </div>
      </form>
    </div>
  </section>

  <app-footerauth></app-footerauth>
</main>
